<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواز</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    img {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      object-position: left center;  /* always keep the left edge in view */
    }
  </style>
</head>
<body>
  <div class="stage">
    <img src="coming_soon.png" alt="Coming Soon">
  </div>
</body>
</html>
