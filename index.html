<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواز</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }
    .stage img {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      object-position: center;
    }

    /* Below 600px wide: show only the leftmost third of the image */
    @media (max-width: 600px) {
      .stage img {
        width: 300vw;          /* three screen-widths wide */
        max-width: none;
        object-position: left center;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <img src="coming_soon.png" alt="Coming Soon">
  </div>
</body>
</html>
